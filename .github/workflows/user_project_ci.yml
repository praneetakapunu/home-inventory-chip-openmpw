name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rtl-compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install iverilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Sync IP filelist + compile RTL (sanity)
        run: |
          make rtl-compile-check

  # Heavy jobs (OpenLane/PDK/precheck) are intentionally not run on every push.
  # Disk/time requirements are large; run these manually when needed.
  heavy-openmpw:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Heavy OpenMPW jobs are disabled by default."
          echo "Run full OpenMPW flow in a dedicated runner with sufficient disk (>= 30GB free)."
